# Publishes a GitHub release whenever a new signed APK is committed to dist/
# on main (dist/JagDroid-v0.28.apk -> release and tag v0.28, with notes from
# dist/notes-v0.28.md). The APK is built and signed before it is committed, so
# the signing key never has to leave the machine that builds releases.
# Releases that already exist are left alone.
name: Release
on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for apk in $(ls dist/JagDroid-v*.apk | sort -V); do
            tag=$(basename "$apk" .apk); tag=${tag#JagDroid-}
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; continue; fi
            notes="dist/notes-$tag.md"
            [ -f "$notes" ] || echo "JagDroid $tag" > "$notes"
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "JagDroid $tag" --notes-file "$notes" --latest
          done
