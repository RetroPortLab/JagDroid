# Publishes a GitHub release when a version tag (v0.27, v0.28, ...) is pushed.
# The signed APK and its notes are committed under dist/ beforehand, so the
# signing key never has to leave the machine that builds releases.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="dist/JagDroid-$TAG.apk"
          notes="dist/notes-$TAG.md"
          test -f "$apk" || { echo "missing $apk"; exit 1; }
          [ -f "$notes" ] || echo "JagDroid $TAG" > "$notes"
          gh release create "$TAG" "$apk" --title "JagDroid $TAG" --notes-file "$notes" --latest
